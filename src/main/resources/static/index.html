<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preço teto</title>
    <link rel="stylesheet" href="css/index.css">

</head>
<body>

    <div id="cabecalho">
        <picture>
            <source media="(max-width: 768px)" srcset="img/icon-banner-mobile.png">
            <img src="img/icon-banner-desktop.png" alt="FCD | Valuation de Fluxo de Caixa">
        </picture>
    </div>
    <div id="container">
        <div id="conteudo-principal">
            <div id="coluna-esquerda">
                <div id="premissas">

                    <div class="titulo-esquerda">
                        <img src="img/icon_premissas.png" alt="Calculadora" class="imagem-titulo">
                        <h2>Premissas</h2> 
                    </div>
                    
                    <div class="campo">
                        <label>Payout médio(%)</label>
                        <div class="campo-input-premissas editavel">
                            <input type="text" id="payout" onfocus="limparCampo('payout')" oninput="calcular()" onblur="formatarPorcentagem('payout')">
                        </div> 
                    </div>

                    <div class="campo">
                        <label>Taxa de desconto(%)</label>
                        <div class="campo-input-premissas editavel">
                            <input type="text" id="taxa-desconto" onfocus="limparCampo('taxa-desconto')" oninput="calcular()" onblur="formatarPorcentagem('taxa-desconto')">
                        </div>
                    </div>
                    
                    <div class="campo">
                        <label>ROE(%)</label>
                        <div class="campo-input-premissas editavel">
                            <input type="text" id="roe" onfocus="limparCampo('roe')" oninput="calcular()" onblur="formatarPorcentagem('roe')">
                        </div>
                    </div>
                    
                    <div class="campo">
                        <label>Taxa de Crescimento Esperada(%)</label>
                        <div class="campo-input-premissas editavel">
                            <input type="text" id="crescimento-esperado" onfocus="limparCampo('crescimento-esperado')" oninput="calcular()" onblur="formatarPorcentagem('crescimento-esperado')">
                        </div>
                    </div>

                </div>
                
                <div id="projecao">

                    <div class="titulo-esquerda">
                        <img src="img/icon_realidade_projetada.png" alt="Grafico de coluna" class="imagem-titulo">
                        <h2>Realidade projetada</h2>
                    </div>
                    
                    <div class="campo">
                        <label>Nº ações ex-tesouraria</label>
                        <div class="editavel campo-input">
                            <input type="text" id="ex-tesouraria" onfocus="limparCampo('ex-tesouraria')" oninput="calcular()" onblur="formatarValor('ex-tesouraria')">
                        </div>                   
                    </div>

                    <div class="campo">
                        <label>Patrimônio Líquido</label>
                        <div class="editavel campo-input">
                            <input type="text" id="patrimonio-liquido" onfocus="limparCampo('patrimonio-liquido')" oninput="calcular()" onblur="formatarMoeda('patrimonio-liquido')">
                        </div>                   
                    </div>
                    
                    <div class="campo">
                        <label>Preço da ação</label>
                        <div class="editavel campo-input">
                            <input type="text" id="preco-acao" onfocus="limparCampo('preco-acao')" oninput="calcular()" onblur="formatarMoeda('preco-acao')">
                        </div>
                    </div>
                    
                    <div id="salvar-preco-teto">
                        <button type="button" class="salvar-preco">Salvar preço teto</button>
                        <button type="button" class="reset" onclick="reset()">Reset</button>
                    </div>

                </div>
            </div>
            
            <div id="coluna-direita">
                
                    
                <div class="titulo-direita">
                    <img src="img/icon_fluxo_caixa.png" alt="Gráfico de linha" class="imagem-titulo">
                    <h2>Fluxo de Caixa Descontado</h2>
                    <div class="botoes-anos">
                        <button class="projecao-3 active">3 anos</button>
                        <button class="projecao-5">5 anos</button>
                    </div>
                </div>
                    
                <table>
                    <thead>
                        <tr>
                            <th>ANO</th>
                            <th>LUCRO LÍQUIDO</th>
                            <th>CRESCIMENTO</th>
                            <th>VPL</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td data-label="Ano">2025</td>
                            <td data-label="Lucro líquido">
                                <div class="editavel campo-input">
                                    <input type="text" id="ll-2025" onfocus="limparCampo('ll-2025')" oninput="calcular()" onblur="formatarMoeda('ll-2025')">
                                </div>
                            </td>
                            <td data-label="Crescimento">-</td>
                            <td data-label="VPL">-</td>
                        </tr>

                        <tr>
                            <td data-label="Ano">2026</td>
                            <td data-label="Lucro líquido">
                                <div class="editavel campo-input">
                                    <input type="text" id="ll-2026"  onfocus="limparCampo('ll-2026')" oninput="calcular()" onblur="formatarMoeda('ll-2026')">
                                </div>
                            </td>
                            <td data-label="Crescimento">
                                <div class="campo-input-crescimento editavel">
                                    <input type="text" id="crescimento-2026" onfocus="limparCampo('crescimento-2026')" oninput="calcular()" onblur="formatarPorcentagem('crescimento-2026')">
                                </div>
                            </td>
                            <td data-label="VPL">
                                <input type="text" id="vpl-2026" disabled oninput="calcular()" onblur="formatarMoeda('vpl-2026')">
                            </td>
                        </tr>

                        <tr>
                            <td data-label="Ano">2027</td>
                            <td data-label="Lucro líquido">
                                <div class="campo-input">
                                    <input type="text" id="ll-2027" disabled oninput="calcular()" onblur="formatarMoeda('ll-2027')">
                                </div>
                            </td>
                            <td data-label="Crescimento">
                                <div class="campo-input-crescimento editavel">
                                    <input type="text" id="crescimento-2027" onfocus="limparCampo('crescimento-2027')" oninput="calcular()" onblur="formatarPorcentagem('crescimento-2027')">
                                </div>
                            </td>
                            <td data-label="VPL">
                                <input type="text" id="vpl-2027" disabled oninput="calcular()" onblur="formatarMoeda('vpl-2027')">
                            </td>
                        </tr>

                        <tr>
                            <td data-label="Ano">2028</td>
                            <td data-label="Lucro líquido">
                                <div class="campo-input">
                                    <input type="text" id="ll-2028" disabled oninput="calcular()" onblur="formatarMoeda('ll-2028')">
                                </div>
                            </td>
                            <td data-label="Crescimento">
                                <div class="campo-input-crescimento editavel">
                                    <input type="text" id="crescimento-2028" onfocus="limparCampo('crescimento-2028')" oninput="calcular()" onblur="formatarPorcentagem('crescimento-2028')">
                                </div>
                            </td>
                            <td data-label="VPL">
                                <input type="text" id="vpl-2028" disabled oninput="calcular()" onblur="formatarMoeda('vpl-2028')">
                            </td>
                        </tr>

                        <tr id="perpetuo">
                            <td data-label="Ano">Perpétuo</td>
                            <td data-label="Lucro líquido">
                                <div class="campo-input">
                                    <input type="text" id="ll-perpetuo" disabled oninput="calcular()" onblur="formatarMoeda('ll-perpetuo')">
                                </div>
                            </td>
                            <td data-label="Crescimento">
                                <div class="campo-input-crescimento editavel">
                                    <input type="text" id="crescimento-perpetuo" onfocus="limparCampo('crescimento-perpetuo')" oninput="calcular()" onblur="formatarPorcentagem('crescimento-perpetuo')">
                                </div>
                            </td>
                            <td data-label="VPL">
                                <input type="text" id="vpl-perpetuo" disabled oninput="calcular()" onblur="formatarMoeda('vpl-perpetuo')">
                            </td>
                        </tr>
                    </tbody>

                </table>

                <div id="resultado-projecao">

                        <div class="campo-linha-mobile">
                            <div class="campo-fcd">
                                <img src="img/icon-preco-atual.png" alt="calculadora" style="width: 40px; height: 40px; margin-right: 5px;">
                                <label>Preço da ação</label>
                                <div class="campo-input">
                                    <input type="text" id="card-preco-acao" oninput="calcular()" onblur="formatarMoeda('preco-acao')" disabled>
                                </div>
                            </div>
    
                            <div class="campo-fcd">
                                <img src="img/icon-preco-teto.png" alt="calculadora" style="width: 40px; height: 40px; margin-right: 5px;"> 
                                <label>Preço teto</label>
                                <div class="campo-input">
                                    <input type="text" id="card-preco-por-acao" disabled oninput="calcular()" onblur="formatarMoeda('preco-por-acao')">
                                </div>
                            </div>
                        </div>

                        <div class="campo-linha-mobile">
                            <div class="campo-fcd">
                                <img src="img/icon-margem-seguranca.png" alt="calculadora" style="width: 40px; height: 40px; margin-right: 5px;">
                                <label>Margem de segurança</label>
                                <div class="campo-input">
                                    <input type="text" id="card-margem-seguranca" disabled oninput="calcular()" onblur="formatarPorcentagem('margem-seguranca')">
                                </div>
                            </div>
                            
                            <div class="campo-fcd">
                                <img src="img/icon-market-cap.png" alt="calculadora" style="width: 40px; height: 40px; margin-right: 5px;">
                                <label>Market cap</label>
                                <div class="campo-input">
                                    <input type="text" id="card-market-cap" disabled oninput="calcular()" onblur="formatarMoeda('market-cap')">
                                </div> 
                            </div>
                        </div>

                </div>
                    
                
            </div>
        </div>

        <div id="anotacoes">
            <div class="titulo-anotacao">
                <img src="img/icon_anotacoes.png" alt="Anotação" class="imagem-titulo">
                <h2>Anotações</h2>
            </div>
            <textarea placeholder="Escreva suas observações aqui... (salva junto com o preço teto)" id="texto-anotacoes"></textarea>
        </div>

    </div>

    <footer>
        <p>Desenvolvido por Dhomini Silva</p>
    </footer>
    
    <script src="js/index.js"></script>
</body>
</html>
